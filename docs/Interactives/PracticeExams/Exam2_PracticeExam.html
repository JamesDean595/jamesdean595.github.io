<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Intro to Macro Practice Exam</title>
  <style>
    :root {
      --bg: #f8fafc;
      --panel: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #cbd5e1;
      --border-strong: #0f172a;
      --accent: #0f172a;
      --accent-soft: #e2e8f0;
      --ok-bg: #dcfce7;
      --ok-border: #22c55e;
      --bad-bg: #ffe4e6;
      --bad-border: #f43f5e;
      --shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
      --radius: 20px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    .page {
      max-width: 1280px;
      margin: 0 auto;
      padding: 24px;
      display: grid;
      gap: 24px;
      grid-template-columns: 280px 1fr;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: var(--shadow);
    }
    .sidebar {
      padding: 20px;
      position: sticky;
      top: 24px;
      align-self: start;
    }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: 1.75rem; line-height: 1.15; }
    h2 { font-size: 1.6rem; line-height: 1.2; }
    .muted { color: var(--muted); }
    .small { font-size: 0.92rem; }
    .section { display: grid; gap: 14px; }
    .spacer { height: 4px; }
    .progress-track {
      width: 100%; height: 12px; background: #e2e8f0; border-radius: 999px; overflow: hidden;
    }
    .progress-bar {
      height: 100%; background: var(--accent); width: 0%; transition: width 0.2s ease;
    }
    .stats {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    }
    .stat {
      background: #f1f5f9; border-radius: 18px; padding: 12px;
    }
    .stat-value { font-size: 1.4rem; font-weight: 700; }
    button {
      font: inherit;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      border-radius: 18px;
      cursor: pointer;
      transition: 0.15s ease;
    }
    button:hover:not(:disabled) { background: #f8fafc; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .primary:hover:not(:disabled) { background: #1e293b; }
    .full { width: 100%; padding: 12px 14px; }
    .nav-grid {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;
    }
    .nav-btn {
      height: 40px; border-radius: 14px; font-size: 0.9rem; font-weight: 600;
    }
    .nav-btn.active { border-color: var(--border-strong); box-shadow: 0 0 0 2px #cbd5e1 inset; }
    .nav-btn.correct { background: var(--ok-bg); }
    .nav-btn.incorrect { background: var(--bad-bg); }

    .main { display: grid; gap: 24px; }
    .card { padding: 24px 28px; }
    .resources { display: none; gap: 20px; }
    .resources.show { display: grid; }
    .resources-grid { display: grid; gap: 20px; grid-template-columns: 1fr; }
    .resource-box {
      border: 1px solid var(--border); border-radius: 22px; padding: 16px; overflow: auto;
    }
    .resource-wide { grid-column: 1 / -1; }
    .question-label {
      font-size: 0.78rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted);
      margin-bottom: 8px;
    }
    .supplement {
      display: none;
      margin: 18px 0 4px;
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 16px;
      overflow: auto;
    }
    .choices { display: grid; gap: 12px; margin-top: 20px; }
    .choice {
      width: 100%; text-align: left; padding: 16px; border-radius: 18px; font-size: 1rem;
    }
    .choice.selected { border-color: var(--border-strong); background: #f1f5f9; }
    .choice.correct { border-color: var(--ok-border); background: #ecfdf5; }
    .choice.incorrect { border-color: var(--bad-border); background: #fff1f2; }
    .feedback {
      display: none; margin-top: 18px; padding: 14px 16px; border-radius: 18px; font-size: 0.96rem;
    }
    .feedback.show { display: block; }
    .feedback.correct { background: var(--ok-bg); color: #14532d; }
    .feedback.incorrect { background: var(--bad-bg); color: #881337; }
    .controls {
      display: flex; flex-wrap: wrap; gap: 12px; margin-top: 18px;
    }
    .footer-controls {
      margin-top: 28px; display: flex; justify-content: space-between; gap: 12px;
    }
    .footer-controls button, .controls button { padding: 12px 16px; }
    .choice-icon { margin-right: 8px; font-weight: 700; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e2e8f0; }
    thead tr { border-top: 4px solid #000; border-bottom: 4px solid #000; }
    svg { max-width: 100%; height: auto; display: block; }
    @media (max-width: 980px) {
      .page { grid-template-columns: 1fr; }
      .sidebar { position: static; }
      .resources-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 640px) {
      .page { padding: 14px; }
      .card, .sidebar { padding: 18px; }
      h1 { font-size: 1.45rem; }
      h2 { font-size: 1.25rem; }
      .nav-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <div class="page">
    <aside class="panel sidebar" aria-label="Exam progress and navigation">
      <div class="section">
        <div>
          <h1>Intro to Macro Practice Exam</h1>
          <p class="muted small" style="margin-top:8px;">One question at a time with immediate feedback.</p>
        </div>

        <div>
          <div style="display:flex;justify-content:space-between;font-size:0.92rem;margin-bottom:8px;">
            <span>Progress</span>
            <span id="progressText">0 / 30</span>
          </div>
          <div class="progress-track"><div class="progress-bar" id="progressBar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="30" aria-label="Exam progress"></div></div>
        </div>

        <div class="stats">
          <div class="stat">
            <div class="muted small" id="scoreLabel">Score</div>
            <div class="stat-value" id="scoreValue" aria-labelledby="scoreLabel">0</div>
          </div>
          <div class="stat">
            <div class="muted small" id="percentLabel">Percent</div>
            <div class="stat-value" id="percentValue" aria-labelledby="percentLabel">0%</div>
          </div>
        </div>

        <button class="full" id="toggleResourcesBtn">Show review visuals</button>
        <button class="full primary" id="restartBtn">Restart exam</button>

        <div aria-label="Question navigator">
          <div class="small" style="font-weight:600; margin-bottom:10px;" aria-hidden="true">Question navigator</div>
          <div class="nav-grid" id="navGrid" role="group" aria-label="Jump to question"></div>
        </div>
      </div>
    </aside>

    <main class="main">
      <section class="panel card resources" id="resourcesSection">
        <div>
          <h2 style="font-size:1.35rem;">Review visuals</h2>
          <p class="muted small" style="margin-top:6px;">Flowchart and diagram from the review sheet, plus the tractor table.</p>
        </div>
        <div class="resources-grid">
          <div class="resource-box">
            <div style="font-weight:600; margin-bottom:12px;">AD / SRAS / LRAS decision tree</div>
            <div id="flowchartBox"></div>
          </div>
          <div class="resource-box">
            <div style="font-weight:600; margin-bottom:12px;">AD-AS graph</div>
            <div id="adasResourceBox"></div>
          </div>
          <div class="resource-box resource-wide">
            <div style="font-weight:600; margin-bottom:12px;">Tractor production table</div>
            <div id="tractorResourceBox"></div>
          </div>
        </div>
      </section>

      <section class="panel card">
        <div class="question-label" id="questionLabel" aria-live="polite"></div>
        <h2 id="questionPrompt" tabindex="-1"></h2>
        <div class="supplement" id="supplement"></div>
        <div class="choices" id="choices" role="group" aria-labelledby="questionPrompt"></div>
        <div class="controls">
          <button class="primary" id="checkBtn">Check answer</button>
        </div>
        <div class="feedback" id="feedback" aria-live="polite" aria-atomic="true"></div>
        <div class="footer-controls">
          <button id="prevBtn">Previous</button>
          <button id="nextBtn">Next</button>
        </div>
      </section>
    </main>
  </div>

  <script>
    const questions = [
      {
            "id": 1,
            "prompt": "In 2025, Canada’s nominal gross domestic product (GDP) was approximately $2.32 trillion. Given that Canada’s population in 2025 was approximately 41.65 million people, GDP per capita in Canada was roughly:",
            "choices": [
                  "a. $5,570.",
                  "b. $55,700.",
                  "c. $557,000.",
                  "d. $23,200."
            ],
            "correct": 1,
            "feedback": "GDP per capita = nominal GDP ÷ population. $2.32 trillion ÷ 41.65 million ≈ $55,702, or about $55,700. All amounts are in current U.S. dollars. Sources: World Bank, <a href=\"https://data.worldbank.org/indicator/NY.GDP.MKTP.CD?locations=CA\" target=\"_blank\" rel=\"noopener noreferrer\">2025 GDP</a> and <a href=\"https://data.worldbank.org/indicator/SP.POP.TOTL?locations=CA\" target=\"_blank\" rel=\"noopener noreferrer\">2025 population</a>."
      },
      {
            "id": 2,
            "prompt": "Economic growth equals the percent change in nominal gross domestic product (GDP) minus the",
            "choices": [
                  "a. percent change in prices and the rate of population growth.",
                  "b. percent change in prices.",
                  "c. rate of population growth.",
                  "d. percent change in prices and the federal budget deficit."
            ],
            "correct": 0,
            "feedback": "Per-capita real GDP growth strips out both inflation and population growth from nominal GDP growth."
      },
      {
            "id": 3,
            "prompt": "In 2011, per capita real gross domestic product (GDP) in Mexico was roughly $10,100. If Mexico experienced economic growth of 4.8 percent in 2012, per capita real GDP would increase to",
            "choices": [
                  "a. $10,585.",
                  "b. $485.",
                  "c. $10,148.",
                  "d. $15,353."
            ],
            "correct": 0,
            "feedback": "Multiply $10,100 by 1.048 to get about $10,585."
      },
      {
            "id": 4,
            "prompt": "With a 3% per-capita real GDP growth, 1% inflation, and 2% population growth, the nominal GDP growth is:",
            "choices": [
                  "a. 4%",
                  "b. 3%",
                  "c. 6%",
                  "d. 0%"
            ],
            "correct": 2,
            "feedback": "Nominal GDP growth is approximately real per-capita growth + inflation + population growth = 3% + 1% + 2% = 6%."
      },
      {
            "id": 5,
            "prompt": "According to the Rule of 70, with a 2% growth rate, per-capita real GDP will double in:",
            "choices": [
                  "a. 17.5 years",
                  "b. 15 years",
                  "c. 20 years",
                  "d. 35 years"
            ],
            "correct": 3,
            "feedback": "The Rule of 70 says doubling time is about 70 ÷ growth rate, so 70 ÷ 2 = 35 years."
      },
      {
            "id": 6,
            "prompt": "Saudi Arabia is an oil-rich country in the Middle East. Much of the country is covered by desert, meaning that the nation’s food production is very low. Much of its food must be imported from other countries. Does this mean that Saudi Arabia has a very small endowment of natural resources?",
            "choices": [
                  "a. No, because Saudi Arabia has lots of petroleum, a fossil fuel, which is also considered a natural resource.",
                  "b. No, because very few people live in Saudi Arabia, so they have no use for large amounts of food production.",
                  "c. Yes, because it has very little land for growing food.",
                  "d. Yes, because it also lacks forests and rivers."
            ],
            "correct": 0,
            "feedback": "Natural resources include more than farmland, and Saudi Arabia is resource-rich because of its petroleum reserves."
      },
      {
            "id": 7,
            "prompt": "Which of the following would boost long-run economic growth?",
            "choices": [
                  "a. Increases in consumer spending",
                  "b. Advances in technology",
                  "c. Higher government taxation",
                  "d. More imports and exports"
            ],
            "correct": 1,
            "feedback": "Technological progress raises productivity and shifts the economy’s production possibilities outward over time."
      },
      {
            "id": 8,
            "prompt": "The production function describes the relationship between",
            "choices": [
                  "a. inflation and unemployment in the economy.",
                  "b. An economy’s inputs and outputs.",
                  "c. the levels of output and spending in the economy.",
                  "d. the aggregate supply and demand for goods in the economy."
            ],
            "correct": 1,
            "feedback": "A production function maps how inputs like labor and capital generate output."
      },
      {
            "id": 9,
            "prompt": "An increase in the level of technology will cause:",
            "choices": [
                  "a. A shift in the production function",
                  "b. Movement along the production function",
                  "c. Decrease in marginal product of labor",
                  "d. Increase in the price level"
            ],
            "correct": 0,
            "feedback": "Better technology changes the relationship between inputs and output, so the whole production function shifts."
      },
      {
            "id": 10,
            "prompt": "When the marginal product of an input falls as the quantity of the input rises, this is known as",
            "choices": [
                  "a. Decreasing returns to scale.",
                  "b. Diminishing minimal output.",
                  "c. Diminishing marginal product.",
                  "d. Inverse marginal product."
            ],
            "correct": 2,
            "feedback": "This is the standard definition of diminishing marginal product."
      },
      {
            "id": 11,
            "prompt": "The total acres plowed when five tractors are used is",
            "choices": [
                  "a. 500.",
                  "b. 480.",
                  "c. 540.",
                  "d. 460."
            ],
            "correct": 0,
            "feedback": "With 4 tractors total acres are 480 and the marginal product of the 5th tractor is 20, so total acres become 500.",
            "supplement": "tractor"
      },
      {
            "id": 12,
            "prompt": "Which of the following is not true about the steady state?",
            "choices": [
                  "a. Net investment equals zero.",
                  "b. There is no change in the capital stock.",
                  "c. The economy is shrinking.",
                  "d. Total investment is positive."
            ],
            "correct": 2,
            "feedback": "At the steady state the capital stock is constant, not necessarily shrinking."
      },
      {
            "id": 13,
            "prompt": "The fundamental characteristic of modern growth theory is the focus on",
            "choices": [
                  "a. the production function.",
                  "b. institutions.",
                  "c. physical capital.",
                  "d. natural resources."
            ],
            "correct": 1,
            "feedback": "Modern growth theory emphasizes the role of institutions in shaping long-run growth outcomes."
      },
      {
            "id": 14,
            "prompt": "A major hurricane passes over an island nation and destroys 25 percent of the buildings and roads. One would expect this to ________ the country’s gross domestic product (GDP) due to a(n) ________ the production function.",
            "choices": [
                  "a. decrease; downward movement along",
                  "b. increase; upward movement along",
                  "c. decrease; downward shift of",
                  "d. increase; upward shift of"
            ],
            "correct": 0,
            "feedback": "A hurricane destroys part of the physical capital stock (buildings and roads). Holding the production function itself constant, having less capital moves the economy downward along that function, reducing output."
      },
      {
            "id": 15,
            "prompt": "One reason why wealthy nations have continued to realize sustained growth is that",
            "choices": [
                  "a. they participate in unfair trade practices with developing nations.",
                  "b. they have passed their steady states.",
                  "c. they are not getting close to their steady states.",
                  "d. there has been continued technological advancement."
            ],
            "correct": 3,
            "feedback": "Continued technological advancements improve productivity and allow sustained increases in output even as an economy accumulates capital."
      },
      {
            "id": 16,
            "prompt": "If the price level falls but workers are reluctant to accept a pay cut, this is an example of",
            "choices": [
                  "a. money illusion.",
                  "b. menu costs.",
                  "c. a supply shock.",
                  "d. an institution."
            ],
            "correct": 0,
            "feedback": "Money illusion occurs when people focus on nominal wages rather than real purchasing power. Here workers resist a nominal wage cut even though the overall price level has fallen."
      },
      {
            "id": 17,
            "prompt": "Consider the wealth effect, interest rate effect, and international trade effect. Of these, the ________ effect is the most significant and the ________ effect is the least significant.",
            "choices": [
                  "a. interest rate; international trade",
                  "b. wealth; interest rate",
                  "c. international trade; wealth",
                  "d. wealth; international trade"
            ],
            "correct": 3,
            "feedback": "In this framework the wealth effect is treated as the strongest and the international trade effect as the weakest."
      },
      {
            "id": 18,
            "prompt": "The aggregate demand curve is best represented by which of the following equations?",
            "choices": [
                  "a. AD = C + I + G + NX",
                  "b. AD = C + I",
                  "c. AD = C + I + G − NX",
                  "d. AD = C + I + G"
            ],
            "correct": 0,
            "feedback": "Aggregate demand is the total of consumption, investment, government spending, and net exports."
      },
      {
            "id": 19,
            "prompt": "The aggregate demand curve slopes downward because",
            "choices": [
                  "a. as price rises, consumers substitute cheaper goods for more expensive goods.",
                  "b. a higher price level increases purchasing power.",
                  "c. a higher price level increases exports.",
                  "d. a higher price level reduces wealth."
            ],
            "correct": 3,
            "feedback": "A higher price level reduces the real value of wealth, which lowers spending and therefore aggregate demand."
      },
      {
            "id": 20,
            "prompt": "Which of the following does not cause the aggregate demand curve to shift?",
            "choices": [
                  "a. A change in oil prices",
                  "b. A change in consumer confidence",
                  "c. A change in expected future income",
                  "d. A change in stock prices"
            ],
            "correct": 0,
            "feedback": "Oil prices mainly affect production costs and SRAS rather than directly shifting AD."
      },
      {
            "id": 21,
            "prompt": "________ would cause a rightward shift of the aggregate demand curve.",
            "choices": [
                  "a. A decrease in the expected price level",
                  "b. A decrease in foreign income",
                  "c. An increase in expected income",
                  "d. A decrease in real wealth"
            ],
            "correct": 2,
            "feedback": "Higher expected income encourages more current spending, shifting aggregate demand right."
      },
      {
            "id": 22,
            "prompt": "If the price level rises by 10 percent, then all else being equal, the long-run quantity of aggregate supply will",
            "choices": [
                  "a. increase by 10 percent.",
                  "b. increase by more than 10 percent.",
                  "c. decrease by 10 percent.",
                  "d. remain unchanged."
            ],
            "correct": 3,
            "feedback": "LRAS is vertical at full-employment output, so a change in the price level does not change long-run output."
      },
      {
            "id": 23,
            "prompt": "Input prices are ________ in the short run and ________ in the long run.",
            "choices": [
                  "a. sticky; sticky",
                  "b. flexible; sticky",
                  "c. flexible; flexible",
                  "d. sticky; flexible"
            ],
            "correct": 3,
            "feedback": "The short run is defined partly by sticky input prices, while in the long run prices adjust."
      },
      {
            "id": 24,
            "prompt": "A decrease in consumer confidence will:",
            "choices": [
                  "a. Shift the SRAS curve right",
                  "b. Shift the SRAS curve left",
                  "c. Shift the AD curve right",
                  "d. Shift the AD curve left"
            ],
            "correct": 3,
            "feedback": "Lower consumer confidence reduces spending, which shifts aggregate demand left."
      },
      {
            "id": 25,
            "prompt": "If there is an increase in the price of oil, we can expect:",
            "choices": [
                  "a. SRAS to shift left",
                  "b. SRAS to shift right",
                  "c. AD to shift left",
                  "d. AD to shift right"
            ],
            "correct": 0,
            "feedback": "Higher oil prices raise firms’ costs, so short-run aggregate supply shifts left."
      },
      {
            "id": 26,
            "prompt": "During the Great Recession, there was a financial crisis, a stock market crash, and a collapse in housing prices, all of which",
            "choices": [
                  "a. contributed to a very long and deep recession.",
                  "b. helped the U.S. economy perform better than the economies of other countries.",
                  "c. kept unemployment from rising above the historical average.",
                  "d. resulted in a very short and mild recession"
            ],
            "correct": 0,
            "feedback": "Those shocks reinforced one another and helped produce a severe, prolonged recession."
      },
      {
            "id": 27,
            "prompt": "If the current short-run equilibrium level of output is less than full-employment output (see above), we can then expect that in the long run",
            "choices": [
                  "a. the price level will rise.",
                  "b. the price level will fall.",
                  "c. aggregate demand will decrease.",
                  "d. aggregate demand will increase."
            ],
            "correct": 1,
            "feedback": "When output is below full employment, wages and input prices tend to fall over time, pushing SRAS right and lowering the price level.",
            "supplement": "adas"
      },
      {
            "id": 28,
            "prompt": "When held up against other economic downturns, the Great Depression had",
            "choices": [
                  "a. very high levels of consumer sentiment.",
                  "b. stable stock prices.",
                  "c. high rates of deflation.",
                  "d. very small changes in real gross domestic product (GDP)."
            ],
            "correct": 2,
            "feedback": "The Great Depression featured substantial deflation along with massive output losses."
      },
      {
            "id": 29,
            "prompt": "Keynesian economists believe that",
            "choices": [
                  "a. the market tends toward stability and full employment.",
                  "b. the economy needs help in moving back to full employment.",
                  "c. prices are flexible.",
                  "d. the long run is more important than the short run."
            ],
            "correct": 1,
            "feedback": "Keynesians emphasize that the economy can get stuck below full employment and may need policy help to recover."
      },
      {
            "id": 30,
            "prompt": "The easing of lockdowns and Covid restriction in 2021 allowed businesses to reopen. This could be interpreted as:",
            "choices": [
                  "a. A rightward shift in AD",
                  "b. A rightward shift in LRAS",
                  "c. A rightward shift in SRAS",
                  "d. A leftward shift in SRAS"
            ],
            "correct": 2,
            "feedback": "Reopening reduced short-run production constraints, which fits a rightward shift in SRAS."
      }
];

    let current = 0;
    let selected = Array(questions.length).fill(null);
    let submitted = Array(questions.length).fill(false);
    let showResources = false;

    const progressText = document.getElementById('progressText');
    const progressBar = document.getElementById('progressBar');
    const scoreValue = document.getElementById('scoreValue');
    const percentValue = document.getElementById('percentValue');
    const toggleResourcesBtn = document.getElementById('toggleResourcesBtn');
    const restartBtn = document.getElementById('restartBtn');
    const navGrid = document.getElementById('navGrid');
    const resourcesSection = document.getElementById('resourcesSection');
    const questionLabel = document.getElementById('questionLabel');
    const questionPrompt = document.getElementById('questionPrompt');
    const supplement = document.getElementById('supplement');
    const choicesBox = document.getElementById('choices');
    const feedback = document.getElementById('feedback');
    const checkBtn = document.getElementById('checkBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    function tractorTableHTML() {
      return `
        <div style="overflow-x:auto;">
          <table>
            <thead>
              <tr>
                <th>Number of Tractors</th>
                <th>Total Acres</th>
                <th>Marginal Product</th>
              </tr>
            </thead>
            <tbody>
              <tr><td>0</td><td>50</td><td>—</td></tr>
              <tr><td>1</td><td>200</td><td>150</td></tr>
              <tr><td>2</td><td>—</td><td>120</td></tr>
              <tr><td>3</td><td>420</td><td>—</td></tr>
              <tr><td>4</td><td>480</td><td>60</td></tr>
              <tr><td>5</td><td>—</td><td>20</td></tr>
            </tbody>
          </table>
        </div>`;

          statusLabel = correct ? 'correct' : 'incorrect';
        }
        btn.setAttribute('aria-label', `Question ${q.id}, ${statusLabel}${i === current ? ', current' : ''}`);
        btn.textContent = q.id;
        btn.addEventListener('click', () => { current = i; render(true); });
        navGrid.appendChild(btn);
      });
    }

    function renderStats() {
      const answeredCount = submitted.filter(Boolean).length;
      const score = questions.reduce((acc, q, i) => acc + ((submitted[i] && selected[i] === q.correct) ? 1 : 0), 0);
      progressText.textContent = `${answeredCount} / ${questions.length}`;
      progressBar.style.width = `${(answeredCount / questions.length) * 100}%`;
      progressBar.setAttribute('aria-valuenow', answeredCount);
      progressBar.setAttribute('aria-valuetext', `${answeredCount} of ${questions.length} questions answered`);
      scoreValue.textContent = score;
      percentValue.textContent = `${answeredCount ? Math.round((score / answeredCount) * 100) : 0}%`;
    }

    function renderSupplement(q) {
      if (!q.supplement) {
        supplement.style.display = 'none';
        supplement.innerHTML = '';
        return;
      }
      supplement.style.display = 'block';
      if (q.supplement === 'tractor') supplement.innerHTML = tractorTableHTML();
      if (q.supplement === 'adas') supplement.innerHTML = adasGraphHTML();
    }

    function renderChoices(q) {
      choicesBox.innerHTML = '';
      choicesBox.setAttribute('role', 'radiogroup');
      choicesBox.setAttribute('aria-labelledby', 'questionPrompt');
      q.choices.forEach((choice, index) => {
        const btn = document.createElement('button');
        btn.className = 'choice';
        btn.setAttribute('role', 'radio');
        const isSelected = selected[current] === index;
        btn.setAttribute('aria-checked', isSelected ? 'true' : 'false');

        let indicatorHtml = '';
        if (submitted[current]) {
          if (index === q.correct) {
            btn.classList.add('correct');
            btn.setAttribute('aria-label', choice + ' — correct answer');
            indicatorHtml = '<span class="choice-icon" aria-hidden="true">✓</span>';
          } else if (isSelected && index !== q.correct) {
            btn.classList.add('incorrect');
            btn.setAttribute('aria-label', choice + ' — incorrect');
            indicatorHtml = '<span class="choice-icon" aria-hidden="true">✗</span>';
          }
        } else {
          if (isSelected) btn.classList.add('selected');
        }

        btn.innerHTML = indicatorHtml + choice;

        btn.addEventListener('click', () => {
          if (submitted[current]) return;
          selected[current] = index;
          render();
        });
        choicesBox.appendChild(btn);
      });
    }

    function renderFeedback(q) {
      const isSubmitted = submitted[current];
      if (!isSubmitted) {
        feedback.className = 'feedback';
        feedback.textContent = '';
        return;
      }
      const isCorrect = selected[current] === q.correct;
      feedback.className = `feedback show ${isCorrect ? 'correct' : 'incorrect'}`;
      feedback.innerHTML = `<strong>${isCorrect ? '✓ Correct.' : `✗ Incorrect. Correct answer: ${q.choices[q.correct]}.`}</strong> ${q.feedback}`;
    }

    function render(moveFocus = false) {
      const q = questions[current];
      questionLabel.textContent = `Question ${q.id} of ${questions.length}`;
      questionPrompt.textContent = q.prompt;
      renderSupplement(q);
      renderChoices(q);
      renderFeedback(q);
      renderNavigator();
      renderStats();
      checkBtn.disabled = selected[current] === null || submitted[current];
      checkBtn.setAttribute('aria-disabled', checkBtn.disabled ? 'true' : 'false');
      prevBtn.disabled = current === 0;
      nextBtn.disabled = current === questions.length - 1;
      prevBtn.setAttribute('aria-disabled', prevBtn.disabled ? 'true' : 'false');
      nextBtn.setAttribute('aria-disabled', nextBtn.disabled ? 'true' : 'false');
      toggleResourcesBtn.textContent = showResources ? 'Hide review visuals' : 'Show review visuals';
      resourcesSection.classList.toggle('show', showResources);
      if (moveFocus) questionPrompt.focus();
    }

    checkBtn.addEventListener('click', () => {
      if (selected[current] === null) return;
      submitted[current] = true;
      render(false);
    });

    prevBtn.addEventListener('click', () => {
      if (current > 0) { current -= 1; render(true); }
    });

    nextBtn.addEventListener('click', () => {
      if (current < questions.length - 1) { current += 1; render(true); }
    });

    toggleResourcesBtn.addEventListener('click', () => {
      showResources = !showResources;
      render();
    });

    restartBtn.addEventListener('click', () => {
      current = 0;
      selected = Array(questions.length).fill(null);
      submitted = Array(questions.length).fill(false);
      showResources = false;
      render(true);
    });

    render();
  </script>
</body>
</html>
